<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Tiles MMO</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@400;600;700&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a28;
    --border: #2a2a44;
    --accent: #00f5ff;
    --accent2: #ff00aa;
    --accent3: #ffe600;
    --text: #e0e0ff;
    --text-dim: #6060a0;
    --green: #00ff88;
    --red: #ff3355;
    --tile-lobby: #1a2a4a;
    --tile-classic: #1a3a2a;
    --tile-chaos: #3a1a1a;
    --tile-shop: #2a2a1a;
    --tile-survival: #2a1a3a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    overflow-x: auto;
    overflow-y: hidden;
    height: 100vh;
    width: 100vw;
    display: flex;
    flex-direction: column;
  }

  /* ===== HORIZONTAL PAGE CONTAINER ===== */
  #page-container {
    display: flex;
    flex-direction: row;
    min-width: fit-content;
    height: 100vh;
  }

  /* ===== SHOP PAGE (scroll right to see) ===== */
  #shop-page {
    width: 100vw;
    min-width: 100vw;
    height: 100vh;
    background: var(--bg);
    border-left: 2px solid var(--accent);
    display: none;
    flex-direction: column;
    overflow-y: auto;
  }
  #shop-page.active { display: flex; }
  .shop-page-header {
    padding: 20px 24px 12px;
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    color: var(--accent);
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .shop-page-hint {
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px;
    color: var(--text-dim);
    font-weight: 600;
    margin-left: auto;
  }
  #shop-grid-full {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    padding: 24px;
    align-content: flex-start;
  }
  #shop-grid-full .shop-item {
    width: 110px;
    padding: 14px;
  }
  #shop-grid-full .shop-swatch {
    width: 52px;
    height: 52px;
  }

  /* ===== LOGIN SCREEN ===== */
  #login-screen {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; align-items: flex-start; justify-content: center;
    z-index: 1000;
    flex-direction: column;
    gap: 20px;
    overflow-y: auto;
    padding: 30px 20px;
    align-items: center;
  }
  #login-screen h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(14px, 3vw, 28px);
    color: var(--accent);
    text-shadow: 0 0 20px var(--accent), 0 0 40px var(--accent);
    animation: pulse 2s infinite;
    text-align: center;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.7} }
  #login-screen p { color: var(--text-dim); font-size: 14px; text-align: center; }
  .login-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 30px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: min(380px, 90vw);
  }
  .login-box label { font-size: 13px; color: var(--text-dim); font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
  .login-box input, .login-box select {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px 12px;
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    width: 100%;
    outline: none;
    transition: border-color .2s;
  }
  .login-box input:focus, .login-box select:focus { border-color: var(--accent); }
  .skin-picker {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }
  .skin-opt {
    width: 100%; aspect-ratio: 1;
    border-radius: 6px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: border-color .15s, transform .15s;
    position: relative;
    overflow: hidden;
  }
  .skin-opt:hover { transform: scale(1.08); }
  .skin-opt.selected { border-color: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .btn-primary {
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 4px;
    padding: 12px;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    cursor: pointer;
    transition: transform .1s, box-shadow .2s;
    letter-spacing: 1px;
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(0,245,255,.4); }
  .btn-primary:active { transform: translateY(0); }

  /* ===== MAIN LAYOUT ===== */
  #main {
    display: none;
    flex-direction: row;
    height: 100vh;
    width: 100vw;
  }

  /* ===== LEFT SIDEBAR ===== */
  #sidebar-left {
    width: 200px;
    min-width: 200px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 0;
    overflow: hidden;
  }
  .sidebar-header {
    padding: 12px;
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    color: var(--accent);
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
  }
  #player-info {
    padding: 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  #player-avatar {
    width: 40px; height: 40px;
    border-radius: 6px;
    border: 2px solid var(--accent);
  }
  #player-name { font-weight: 700; font-size: 14px; }
  #player-level { font-size: 12px; color: var(--accent3); }
  .xp-bar-wrap { background: var(--surface2); border-radius: 4px; height: 6px; overflow: hidden; }
  .xp-bar { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 4px; transition: width .5s; }
  #player-coins { font-size: 12px; color: var(--accent3); }
  #player-wins { font-size: 12px; color: var(--text-dim); }

  .section-title {
    padding: 8px 12px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
  }

  #players-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .player-entry {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 8px;
    border-radius: 4px;
    font-size: 13px;
    background: var(--surface2);
    border: 1px solid transparent;
    transition: border-color .2s;
  }
  .player-entry.me { border-color: var(--accent); }
  .player-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
  .player-entry-name { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ===== GAME CANVAS AREA ===== */
  #game-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  #top-bar {
    height: 40px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 12px;
    font-size: 13px;
  }
  #zone-label {
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    color: var(--accent);
  }
  #match-status {
    flex: 1;
    text-align: center;
    font-size: 12px;
    color: var(--text-dim);
  }
  .top-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 4px;
    padding: 4px 10px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 12px;
    cursor: pointer;
    transition: border-color .2s;
    font-weight: 600;
  }
  .top-btn:hover { border-color: var(--accent); color: var(--accent); }

  #grid-wrap {
    flex: 1;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #grid {
    display: grid;
    grid-template-columns: repeat(30, 1fr);
    grid-template-rows: repeat(30, 1fr);
    position: relative;
  }

  .cell {
    box-sizing: border-box;
    border: 1px solid rgba(255,255,255,0.03);
    background: var(--tile-lobby);
    position: relative;
    transition: background .15s;
  }
  .cell.zone-classic { background: var(--tile-classic); }
  .cell.zone-chaos { background: var(--tile-chaos); }
  .cell.zone-shop { background: var(--tile-shop); }
  .cell.zone-survival { background: var(--tile-survival); }
  .cell.zone-label-classic::after,
  .cell.zone-label-chaos::after,
  .cell.zone-label-shop::after,
  .cell.zone-label-survival::after {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Press Start 2P', monospace;
    font-size: 5px;
    opacity: 0.3;
    pointer-events: none;
  }
  .cell.zone-label-classic::after  { content: 'CLASSIC';  color: #0ff; }
  .cell.zone-label-chaos::after    { content: 'CHAOS';    color: #f44; }
  .cell.zone-label-shop::after     { content: 'SHOP';     color: #ff0; }
  .cell.zone-label-survival::after { content: 'SURVIVAL'; color: #a0f; }

  /* player on cell */
  .cell .player-sprite {
    position: absolute;
    inset: 2px;
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 8px;
    font-weight: bold;
    z-index: 2;
    transition: all .08s;
    border: 1px solid rgba(255,255,255,0.3);
  }
  .cell .player-sprite.me-sprite {
    box-shadow: 0 0 8px currentColor;
    z-index: 3;
  }
  .cell .player-sprite .pip {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: white;
    opacity: 0.7;
  }

  /* captured tiles */
  .cell.captured { opacity: .85; }

  /* shrink zone (survival) */
  .cell.danger { animation: dangerFlash 1s infinite; }
  @keyframes dangerFlash { 0%,100%{border-color:rgba(255,0,0,0.2)} 50%{border-color:rgba(255,0,0,0.8)} }

  /* countdown overlay */
  #countdown-overlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.7);
    z-index: 50;
    flex-direction: column;
    gap: 16px;
    pointer-events: none;
  }
  #countdown-overlay.active { display: flex; }
  #countdown-num {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(40px, 10vw, 80px);
    color: var(--accent);
    text-shadow: 0 0 40px var(--accent);
    animation: countBounce .9s ease-out;
  }
  @keyframes countBounce { 0%{transform:scale(1.5);opacity:0} 100%{transform:scale(1);opacity:1} }
  #countdown-label {
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    color: var(--text);
    text-align: center;
  }

  /* vote bars */
  #vote-ui {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 10px 14px;
    display: none;
    flex-direction: column;
    gap: 8px;
    z-index: 20;
  }
  #vote-ui.active { display: flex; }
  .vote-row {
    display: flex; align-items: center; gap: 10px; font-size: 13px;
  }
  .vote-mode { width: 70px; font-weight: 700; }
  .vote-bar-wrap { flex: 1; background: var(--surface2); border-radius: 4px; height: 14px; overflow: hidden; border: 1px solid var(--border); }
  .vote-bar { height: 100%; border-radius: 4px; transition: width .4s; }
  .vote-bar.classic { background: var(--green); }
  .vote-bar.chaos { background: var(--red); }
  .vote-bar.survival { background: #a040ff; }
  .vote-count { width: 24px; text-align: right; font-size: 12px; color: var(--text-dim); }
  .vote-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 3px;
    padding: 2px 8px;
    cursor: pointer;
    font-family: 'Rajdhani', sans-serif;
    font-size: 12px;
    font-weight: 600;
    transition: border-color .2s;
  }
  .vote-btn:hover { border-color: var(--accent); color: var(--accent); }
  .vote-btn.voted { border-color: var(--accent); color: var(--accent); background: rgba(0,245,255,0.1); }

  /* ===== RIGHT SIDEBAR ===== */
  #sidebar-right {
    width: 220px;
    min-width: 220px;
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* CHAT */
  #chat-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-bottom: 1px solid var(--border);
  }
  #chat-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
  }
  .chat-tab {
    flex: 1;
    padding: 7px;
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    color: var(--text-dim);
    transition: color .2s, border-color .2s;
    border-bottom: 2px solid transparent;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .chat-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  #chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 12px;
  }
  .msg {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .msg-header {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .msg-name { font-weight: 700; font-size: 12px; }
  .msg-time { font-size: 10px; color: var(--text-dim); }
  .msg-muted { opacity: 0.3; }
  .msg-text { font-size: 12px; color: var(--text); line-height: 1.4; }
  .msg-system { font-size: 11px; color: var(--text-dim); font-style: italic; }
  .msg-mute-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 10px;
    padding: 0 2px;
  }
  .msg-mute-btn:hover { color: var(--red); }
  #chat-input-wrap {
    padding: 8px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 6px;
  }
  #chat-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 6px 8px;
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 12px;
    outline: none;
  }
  #chat-input:focus { border-color: var(--accent); }
  #chat-send {
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 3px;
    padding: 6px 10px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 700;
  }

  /* SHOP */
  #shop-panel {
    max-height: 280px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }
  .shop-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    padding: 8px;
  }
  .shop-item {
    border-radius: 6px;
    border: 2px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8px 4px;
    gap: 4px;
    cursor: pointer;
    transition: border-color .2s, transform .15s;
    position: relative;
  }
  .shop-item:hover { border-color: var(--accent); transform: scale(1.04); }
  .shop-item.owned { border-color: var(--green); }
  .shop-item.equipped { border-color: var(--accent2); box-shadow: 0 0 8px var(--accent2); }
  .shop-item.locked { opacity: 0.5; cursor: not-allowed; }
  .shop-swatch { width: 32px; height: 32px; border-radius: 4px; }
  .shop-name { font-size: 9px; text-align: center; font-weight: 700; line-height: 1.2; }
  .shop-price { font-size: 9px; color: var(--accent3); }
  .shop-badge {
    position: absolute;
    top: 2px; right: 2px;
    font-size: 8px;
    background: var(--accent2);
    color: white;
    border-radius: 2px;
    padding: 0 2px;
  }

  /* LEADERBOARD */
  #leaderboard-panel {
    padding: 8px;
    overflow-y: auto;
    max-height: 200px;
  }
  .lb-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 6px;
    border-radius: 3px;
    font-size: 12px;
    border-bottom: 1px solid var(--border);
  }
  .lb-rank { width: 18px; color: var(--text-dim); font-size: 11px; text-align: center; }
  .lb-swatch { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
  .lb-name { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-wins { color: var(--accent3); font-size: 11px; }

  /* MATCH END OVERLAY */
  #match-end-overlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.85);
    z-index: 60;
    flex-direction: column;
    gap: 20px;
  }
  #match-end-overlay.active { display: flex; }
  #match-end-title {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(16px, 4vw, 32px);
    text-align: center;
  }
  #match-end-title.win { color: var(--accent3); text-shadow: 0 0 30px var(--accent3); }
  #match-end-title.lose { color: var(--text-dim); }
  #match-end-sub { font-size: 16px; color: var(--text); }
  #match-end-xp { font-size: 18px; color: var(--green); font-weight: 700; }

  /* ROOM PANELS */
  #room-panel {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.8);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
  }
  #room-panel.active { display: flex; }
  .room-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 24px;
    width: min(440px, 92vw);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .room-box h2 { font-family: 'Press Start 2P', monospace; font-size: 12px; color: var(--accent); }
  .room-list { display: flex; flex-direction: column; gap: 8px; max-height: 240px; overflow-y: auto; }
  .room-entry {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    transition: border-color .2s, background .2s;
    font-size: 15px;
  }
  .room-entry:hover { border-color: var(--accent); background: rgba(0,245,255,0.04); }
  .room-entry .room-name { flex: 1; font-weight: 700; font-size: 15px; }
  .room-entry .room-count { font-size: 13px; color: var(--text-dim); }
  .room-entry .room-lock { font-size: 15px; }
  .modal-close {
    align-self: flex-end;
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 3px;
    padding: 5px 12px;
    cursor: pointer;
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px;
  }
  .modal-close:hover { color: var(--text); border-color: var(--text); }
  .field-group { display: flex; flex-direction: column; gap: 4px; }
  .field-group label { font-size: 12px; color: var(--text-dim); font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
  .field-group input, .field-group select {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 10px;
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    outline: none;
  }
  .field-group input:focus, .field-group select:focus { border-color: var(--accent); }

  /* TOAST */
  #toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface2);
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 10px 20px;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    z-index: 999;
    opacity: 0;
    transition: opacity .3s;
    pointer-events: none;
  }
  #toast.show { opacity: 1; }

  /* Mobile joystick */
  #joystick-zone {
    position: fixed;
    bottom: 20px;
    left: 20px;
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: rgba(255,255,255,0.05);
    border: 2px solid rgba(255,255,255,0.1);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    touch-action: none;

// ═══════════════════════════════════════════
//  SKINS CATALOG
// ═══════════════════════════════════════════
const SKINS = [
  { id: 'red',       name: 'Lava',      color: '#ff3355', bg: '#2a0010', cost: 0,   level: 0 },
  { id: 'blue',      name: 'Ocean',     color: '#00aaff', bg: '#001828', cost: 0,   level: 0 },
  { id: 'green',     name: 'Forest',    color: '#00ff88', bg: '#002210', cost: 0,   level: 0 },
  { id: 'yellow',    name: 'Storm',     color: '#ffe600', bg: '#1a1400', cost: 50,  level: 2 },
  { id: 'purple',    name: 'Void',      color: '#cc44ff', bg: '#110018', cost: 50,  level: 2 },
  { id: 'orange',    name: 'Blaze',     color: '#ff8800', bg: '#1a0800', cost: 100, level: 4 },
  { id: 'cyan',      name: 'Cyber',     color: '#00f5ff', bg: '#001a1a', cost: 100, level: 4 },
  { id: 'pink',      name: 'Sakura',    color: '#ff55aa', bg: '#1a0010', cost: 150, level: 6 },
  { id: 'white',     name: 'Ghost',     color: '#e0e0ff', bg: '#10101a', cost: 200, level: 8 },
  { id: 'rainbow',   name: 'Prism',     color: 'linear-gradient(45deg,red,orange,yellow,green,cyan,blue,violet)', bg: '#0a0a0a', cost: 500, level: 10 },
  { id: 'gold',      name: 'Legend',    color: '#ffd700', bg: '#1a1000', cost: 300, level: 12 },
  { id: 'dark',      name: 'Shadow',    color: '#334455', bg: '#050508', cost: 250, level: 10 },
];

function skinColor(id) {
  const s = SKINS.find(x => x.id === id);
  return s ? s.color : '#888';
}
function skinBg(id) {
  const s = SKINS.find(x => x.id === id);
  return s ? s.bg : '#222';
}

function drawSkinCanvas(canvas, skinId) {
  const ctx = canvas.getContext('2d');
  const s = SKINS.find(x => x.id === skinId) || SKINS[0];
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (s.color.startsWith('linear')) {
    const grd = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
    grd.addColorStop(0, '#ff0000');
    grd.addColorStop(0.17, '#ff8800');
    grd.addColorStop(0.33, '#ffff00');
    grd.addColorStop(0.5, '#00ff00');
    grd.addColorStop(0.67, '#00ffff');
    grd.addColorStop(0.83, '#0000ff');
    grd.addColorStop(1, '#ff00ff');
    ctx.fillStyle = grd;
  } else {
    ctx.fillStyle = s.color;
  }
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.fillRect(0, 0, canvas.width, canvas.height / 2);
}

// ═══════════════════════════════════════════
//  AUTH HELPERS
// ═══════════════════════════════════════════
async function hashPassword(pw) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function nameDisplay(name) {
  if (!name) return name;
  if (name === 'Nyx') return '👑 ' + name;
  return name;
}

// ═══════════════════════════════════════════
//  PLAYER STATE
// ═══════════════════════════════════════════
let playerId = null;
let playerName = '';
let playerSkin = 'red';
let playerData = { xp: 0, coins: 0, wins: 0, level: 1, ownedSkins: ['red','blue','green'] };
let pos = { x: 15, y: 15 };
let gamePhase = 'lobby';
let currentMode = 'classic';
let matchPlayers = {};
let matchTiles = {};
let matchTimer = null;
let myVote = null;
let chatChannel = 'lobby';
let mutedPlayers = new Set();
let lobbyPlayers = {};
let survivalRadius = 14;
let survivalCenter = { x: 15, y: 15 };
let chaosTeleportInterval = null;
let currentRoom = 'lobby';

// ═══════════════════════════════════════════
//  GRID
// ═══════════════════════════════════════════
const GRID_SIZE = 30;
const gridEl = document.getElementById('grid');
const cells = [];

function initGrid() {
  const wrap = document.getElementById('grid-wrap');
  const side = Math.min(wrap.clientWidth, wrap.clientHeight) - 4;
  gridEl.style.width = side + 'px';
  gridEl.style.height = side + 'px';
  gridEl.innerHTML = '';
  cells.length = 0;
  for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
    const c = document.createElement('div');
    c.className = 'cell';
    gridEl.appendChild(c);
    cells.push(c);
  }
}

function zoneAt(x, y) {
  if (x <= 8 && y <= 8) return 'classic';
  if (x >= 21 && y <= 8) return 'chaos';
  if (x <= 8 && y >= 21) return 'survival';
  if (x >= 21 && y >= 21) return 'shop';
  return null;
}

function renderGrid(allPlayers) {
  const isMatch = (gamePhase === 'match');

  cells.forEach((c, i) => {
    const x = i % GRID_SIZE;
    const y = Math.floor(i / GRID_SIZE);
    const zone = zoneAt(x, y);

    c.className = 'cell';
    if (zone) c.classList.add('zone-' + zone);

    if (zone === 'classic'  && x === 4  && y === 4)  c.classList.add('zone-label-classic');
    if (zone === 'chaos'    && x === 25 && y === 4)  c.classList.add('zone-label-chaos');
    if (zone === 'survival' && x === 4  && y === 25) c.classList.add('zone-label-survival');
    if (zone === 'shop'     && x === 25 && y === 25) c.classList.add('zone-label-shop');

    if (isMatch && matchTiles[i]) {
      const ownerId = matchTiles[i];
      const ownerSkin = allPlayers[ownerId]?.skin || 'red';
      c.style.background = skinBg(ownerSkin);
      c.classList.add('captured');
    } else {
      c.style.background = '';
    }

    if (isMatch && currentMode === 'survival') {
      const dist = Math.sqrt((x - survivalCenter.x) ** 2 + (y - survivalCenter.y) ** 2);
      if (dist > survivalRadius) c.classList.add('danger');
    }

    c.innerHTML = '';
  });

  for (const id in allPlayers) {
    const p = allPlayers[id];
    if (!p || p.x === undefined) continue;
    if (isMatch && !matchPlayers[id]) continue;

    const idx = p.y * GRID_SIZE + p.x;
    if (!cells[idx]) continue;

    const sprite = document.createElement('div');
    sprite.className = 'player-sprite' + (id === playerId ? ' me-sprite' : '');
    const col = skinColor(p.skin || 'red');
    sprite.style.background = col.startsWith('linear') ? col : col;
    sprite.style.color = col;
    sprite.style.opacity = '0.95';
    const pip = document.createElement('div');
    pip.className = 'pip';
    sprite.appendChild(pip);
    cells[idx].appendChild(sprite);
  }
}

function renderSelf() {
  if (!playerId || !cells.length) return;
  cells.forEach(c => { const old = c.querySelector('.me-sprite'); if (old) old.remove(); });
  const idx = pos.y * GRID_SIZE + pos.x;
  if (!cells[idx]) return;
  const sprite = document.createElement('div');
  sprite.className = 'player-sprite me-sprite';
  const col = skinColor(playerSkin);
  sprite.style.background = col.startsWith('linear') ? col : col;
  sprite.style.color = col;
  sprite.style.opacity = '0.95';
  const pip = document.createElement('div');
  pip.className = 'pip';
  sprite.appendChild(pip);
  cells[idx].appendChild(sprite);
}

// ═══════════════════════════════════════════
//  LOGIN
// ═══════════════════════════════════════════
function buildLoginSkins() {
  const picker = document.getElementById('skin-picker');
  picker.innerHTML = '';
  ['red','blue','green','yellow','purple'].forEach(sid => {
    const s = SKINS.find(x => x.id === sid);
    const canvas = document.createElement('canvas');
    canvas.width = 44; canvas.height = 44;
    canvas.className = 'skin-opt' + (sid === playerSkin ? ' selected' : '');
    canvas.title = s.name;
    drawSkinCanvas(canvas, sid);
    canvas.addEventListener('click', () => {
      playerSkin = sid;
      picker.querySelectorAll('.skin-opt').forEach(c => c.classList.remove('selected'));
      canvas.classList.add('selected');
    });
    picker.appendChild(canvas);
  });
}

let loginStep = 0;
let loginIsNewUser = false;

function resetLoginStep() {
  loginStep = 0;
  loginIsNewUser = false;
  document.getElementById('username-input').disabled = false;
  document.getElementById('username-input').focus();
  document.getElementById('pw-section').style.display = 'none';
  document.getElementById('pw-input').value = '';
  document.getElementById('pw-confirm-input').value = '';
  document.getElementById('pw-confirm-wrap').style.display = 'none';
  const btn = document.getElementById('login-btn');
  btn.textContent = '▶ ENTER LOBBY';
  btn.disabled = false;
}

async function handleLoginBtn() {
  const btn = document.getElementById('login-btn');
  if (btn.disabled) return;

  if (loginStep === 0) {
    const name = document.getElementById('username-input').value.trim();
    if (!name || name.length < 2) { showToast('Enter a username (min 2 chars)'); return; }
    btn.textContent = 'Checking...';
    btn.disabled = true;
    try {
      const nameKey = name.toLowerCase().replace(/[^a-z0-9]/g, '_');
      const snap = await db.ref('users/' + nameKey).once('value');
      const existing = snap.val();
      document.getElementById('pw-section').style.display = '';
      document.getElementById('username-input').disabled = true;
      if (existing) {
        loginIsNewUser = false;
        document.getElementById('pw-label').textContent = 'Password';
        document.getElementById('pw-hint').textContent = 'Welcome back! Enter your password.';
        document.getElementById('pw-confirm-wrap').style.display = 'none';
        btn.textContent = '▶ LOGIN';
      } else {
        loginIsNewUser = true;
        document.getElementById('pw-label').textContent = 'Create Password';
        document.getElementById('pw-hint').textContent = 'New account — choose a password.';
        document.getElementById('pw-confirm-wrap').style.display = '';
        btn.textContent = '▶ CREATE ACCOUNT';
      }
      document.getElementById('pw-input').focus();
      loginStep = 1;
      btn.disabled = false;
    } catch(e) {
      showToast('Connection error. Try again.');
      btn.textContent = '▶ ENTER LOBBY';
      btn.disabled = false;
    }
    return;
  }

  const name = document.getElementById('username-input').value.trim();
  const pw = document.getElementById('pw-input').value;
  if (!pw) { showToast('Enter your password'); return; }
  btn.textContent = 'Verifying...';
  btn.disabled = true;
  try {
    const hash = await hashPassword(pw);
    const nameKey = name.toLowerCase().replace(/[^a-z0-9]/g, '_');
    if (loginIsNewUser) {
      const pw2 = document.getElementById('pw-confirm-input').value;
      if (pw !== pw2) { showToast('Passwords do not match!'); btn.textContent = '▶ CREATE ACCOUNT'; btn.disabled = false; return; }
      if (pw.length < 3) { showToast('Password must be at least 3 characters'); btn.textContent = '▶ CREATE ACCOUNT'; btn.disabled = false; return; }
      await db.ref('users/' + nameKey).set({ hash, displayName: name });
    } else {
      const snap = await db.ref('users/' + nameKey).once('value');
      const existing = snap.val();
      if (!existing || hash !== existing.hash) {
        showToast('❌ Wrong password!');
        btn.textContent = '▶ LOGIN';
        btn.disabled = false;
        return;
      }
    }
    const banSnap = await db.ref('bans/' + nameKey).once('value');
    if (banSnap.val()) {
      showToast('🚫 You are banned from this server!');
      btn.textContent = loginIsNewUser ? '▶ CREATE ACCOUNT' : '▶ LOGIN';
      btn.disabled = false;
      return;
    }
    enterGame(name);
  } catch(e) {
    showToast('Error. Try again.');
    btn.textContent = loginIsNewUser ? '▶ CREATE ACCOUNT' : '▶ LOGIN';
    btn.disabled = false;
  }
}

function enterGame(name) {
  playerName = name;
  playerId = 'p_' + name.replace(/[^a-zA-Z0-9]/g, '_') + '_' + Math.random().toString(36).substr(2, 4);

  const savedRaw = localStorage.getItem('ptiles_' + playerName);
  if (savedRaw) {
    try { playerData = { ...playerData, ...JSON.parse(savedRaw) }; } catch(e) {}
    if (!playerData.ownedSkins) playerData.ownedSkins = ['red','blue','green'];
  }
  if (!playerData.ownedSkins.includes(playerSkin)) playerSkin = playerData.equippedSkin || 'red';
  else playerData.equippedSkin = playerSkin;

  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('main').style.display = 'flex';
  document.getElementById('shop-page').classList.add('active');

  requestAnimationFrame(() => {
    initGrid();
    setupGame();
    buildShop();
    updatePlayerHUD();
    renderSelf();
  });
}

// ═══════════════════════════════════════════
//  GAME SETUP
//
//  FIX: players are now written to root-level `players/`
//  instead of `rooms/lobby/players/` — this matches the
//  same permission level where chat/lobby already works.
// ═══════════════════════════════════════════
function setupGame() {
  // ── Write self into the shared lobby ──
  const ref = db.ref('players/' + playerId);
  ref.set({
    name: playerName,
    skin: playerSkin,
    x: pos.x,
    y: pos.y,
    xp: playerData.xp,
    wins: playerData.wins,
    coins: playerData.coins,
    level: playerData.level
  });
  ref.onDisconnect().remove();

  // ── Listen to ALL lobby players ──
  db.ref('players').on('value', snap => {
    const players = snap.val() || {};
    lobbyPlayers = players;
    if (gamePhase === 'lobby' || gamePhase === 'countdown') {
      renderGrid(players);
      renderPlayerList(players);
      renderLeaderboard(players);
      checkZoneTrigger(players);
    }
  });

  // Listen to lobby chat
  db.ref('chat/lobby').limitToLast(80).on('child_added', snap => {
    const msg = snap.val();
    if (msg && chatChannel === 'lobby') appendChatMsg(msg);
  });

  // Listen to votes
  db.ref('votes/lobby').on('value', snap => {
    const v = snap.val() || { classic: 0, chaos: 0, survival: 0 };
    updateVoteUI(v);
  });

  // Listen for admin actions (kick / ban)
  db.ref('actions/' + playerId).on('value', snap => {
    const data = snap.val();
    if (!data) return;
    db.ref('actions/' + playerId).remove();
    if (data.action === 'kick') {
      document.getElementById('shop-page').classList.remove('active');
      document.getElementById('main').style.display = 'none';
      document.getElementById('login-screen').style.display = 'flex';
      playerName = ''; playerId = '';
      showToast('👢 You were kicked from the server!');
    } else if (data.action === 'ban') {
      document.body.innerHTML = `<div style="position:fixed;inset:0;background:#0a0a0f;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#ff3355;font-family:'Press Start 2P',monospace;gap:24px;text-align:center;padding:20px"><div style="font-size:48px">🚫</div><div style="font-size:16px">YOU ARE BANNED</div><div style="font-size:9px;color:#6060a0;line-height:1.8">You have been banned by an admin.<br>This decision is final.</div></div>`;
    }
  });

  // Listen for whispers
  db.ref('whispers/' + playerId).on('child_added', snap => {
    const w = snap.val();
    if (!w) return;
    appendChatMsg({ system: true, text: `💌 Whisper from ${w.from}: ${w.text}`, ts: w.ts });
    snap.ref.remove();
  });

  // Listen for map reset signal
  db.ref('lobby/reset').on('value', snap => {
    const data = snap.val();
    if (!data || (Date.now() - data.ts) > 5000) return;
    pos.x = 15; pos.y = 15;
    matchTiles = {};
    renderSelf();
    if (data.by !== playerName) showToast('🔄 Map reset by ' + data.by + '!');
  });

  document.getElementById('btn-vote').style.display = 'inline-block';
  setupJoystick();
  setupKeyboard();
}

// ═══════════════════════════════════════════
//  MOVEMENT
// ═══════════════════════════════════════════
let moveThrottle = false;
function movePlayer(dx, dy) {
  if (moveThrottle) return;
  moveThrottle = true;
  setTimeout(() => moveThrottle = false, gamePhase === 'match' && currentMode === 'chaos' ? 80 : 120);

  const newX = Math.max(0, Math.min(GRID_SIZE - 1, pos.x + dx));
  const newY = Math.max(0, Math.min(GRID_SIZE - 1, pos.y + dy));

  if (gamePhase === 'match' && currentMode === 'survival') {
    const dist = Math.sqrt((newX - survivalCenter.x) ** 2 + (newY - survivalCenter.y) ** 2);
    if (dist > survivalRadius) { showToast('⚠ Danger zone!'); return; }
  }

  pos.x = newX; pos.y = newY;

  if (gamePhase === 'match') {
    // Update only x,y — do not overwrite other player fields
    db.ref('rooms/match_' + currentRoom + '/players/' + playerId + '/x').set(pos.x);
    db.ref('rooms/match_' + currentRoom + '/players/' + playerId + '/y').set(pos.y);

    const idx = pos.y * GRID_SIZE + pos.x;
    matchTiles[idx] = playerId;
    db.ref('rooms/match_' + currentRoom + '/tiles/' + idx).set(playerId);
    playerData.xp += 1;
    updateXPBar();
  } else {
    // Lobby: update only x,y — do not overwrite name/skin/stats
    db.ref('players/' + playerId + '/x').set(pos.x);
    db.ref('players/' + playerId + '/y').set(pos.y);
  }

  if (gamePhase === 'match' && currentMode === 'chaos' && Math.random() < 0.05) {
    pos.x = Math.floor(Math.random() * GRID_SIZE);
    pos.y = Math.floor(Math.random() * GRID_SIZE);
    showToast('⚡ Teleported!');
  }

  updateZoneLabel();
  renderSelf();
}

function setupKeyboard() {
  document.addEventListener('keydown', e => {
    const key = e.key.toLowerCase();
    if (key === 'r' && playerName === 'Nyx') { e.preventDefault(); resetMap(); return; }
    if (document.activeElement === document.getElementById('chat-input')) return;
    if (key === 'w' || e.key === 'ArrowUp') movePlayer(0, -1);
    if (key === 's' || e.key === 'ArrowDown') movePlayer(0, 1);
    if (key === 'a' || e.key === 'ArrowLeft') movePlayer(-1, 0);
    if (key === 'd' || e.key === 'ArrowRight') movePlayer(1, 0);
  });
}

function resetMap() {
  const roomRef = gamePhase === 'match' ? 'rooms/match_' + currentRoom : 'players';
  if (gamePhase === 'match') {
    db.ref('rooms/match_' + currentRoom + '/tiles').remove();
    db.ref('rooms/match_' + currentRoom + '/players').once('value', snap => {
      const all = snap.val() || {};
      const updates = {};
      Object.keys(all).forEach(id => { updates[id + '/x'] = 15; updates[id + '/y'] = 15; });
      db.ref('rooms/match_' + currentRoom + '/players').update(updates);
    });
  } else {
    db.ref('players').once('value', snap => {
      const all = snap.val() || {};
      const updates = {};
      Object.keys(all).forEach(id => { updates[id + '/x'] = 15; updates[id + '/y'] = 15; });
      db.ref('players').update(updates);
    });
  }
  pos.x = 15; pos.y = 15;
  matchTiles = {};
  renderSelf();
  db.ref('lobby/reset').set({ ts: Date.now(), by: playerName });
  setTimeout(() => db.ref('lobby/reset').remove(), 3000);
  showToast('🔄 Map reset!');
}

function setupJoystick() {
  const zone = document.getElementById('joystick-zone');
  const stick = document.getElementById('joystick-stick');
  let jActive = false;
  let jOrigin = { x: 0, y: 0 };
  let jInterval = null;
  let jDir = { x: 0, y: 0 };

  zone.addEventListener('touchstart', e => {
    jActive = true;
    const t = e.touches[0];
    const r = zone.getBoundingClientRect();
    jOrigin = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    jInterval = setInterval(() => {
      if (Math.abs(jDir.x) > 0.3 || Math.abs(jDir.y) > 0.3) {
        movePlayer(Math.round(jDir.x), Math.round(jDir.y));
      }
    }, 180);
    e.preventDefault();
  }, { passive: false });

  zone.addEventListener('touchmove', e => {
    if (!jActive) return;
    const t = e.touches[0];
    const dx = (t.clientX - jOrigin.x) / 40;
    const dy = (t.clientY - jOrigin.y) / 40;
    const mag = Math.sqrt(dx * dx + dy * dy);
    jDir = mag > 1 ? { x: dx / mag, y: dy / mag } : { x: dx, y: dy };
    stick.style.left = (50 + jDir.x * 20) + '%';
    stick.style.top = (50 + jDir.y * 20) + '%';
    e.preventDefault();
  }, { passive: false });

  zone.addEventListener('touchend', () => {
    jActive = false; jDir = { x: 0, y: 0 };
    stick.style.left = '50%'; stick.style.top = '50%';
    clearInterval(jInterval);
  });
}

// ═══════════════════════════════════════════
//  ZONES & AUTO MATCH
// ═══════════════════════════════════════════
function updateZoneLabel() {
  const z = zoneAt(pos.x, pos.y) || 'lobby';
  document.getElementById('zone-label').textContent = z.toUpperCase();
  if (z === 'shop') buildShop();
}

let countdownActive = false;

function checkZoneTrigger(players) {
  if (gamePhase !== 'lobby' || countdownActive) return;

  const zoneCounts = { classic: [], chaos: [], survival: [] };
  for (const id in players) {
    const p = players[id];
    const z = zoneAt(p.x, p.y);
    if (z && z !== 'shop' && zoneCounts[z]) zoneCounts[z].push(id);
  }

  for (const z in zoneCounts) {
    if (zoneCounts[z].length >= 2) {
      startCountdown(z, zoneCounts[z]);
      return;
    }
  }

  document.getElementById('match-status').textContent = 'Move to a zone to play!';
}

function startCountdown(mode, playerIds) {
  countdownActive = true;
  currentMode = mode;
  const pInZone = playerIds;

  document.getElementById('match-status').textContent = `${mode.toUpperCase()} match detected! Starting...`;
  db.ref('lobby/countdown').set({ mode, players: pInZone.reduce((a, id) => { a[id] = true; return a; }, {}), ts: Date.now() });

  let t = 10;
  const overlay = document.getElementById('countdown-overlay');
  const numEl = document.getElementById('countdown-num');
  const labelEl = document.getElementById('countdown-label');
  overlay.classList.add('active');
  numEl.textContent = t;
  labelEl.textContent = mode.toUpperCase() + ' MATCH';

  const interval = setInterval(() => {
    t--;
    numEl.textContent = t;
    if (t <= 0) {
      clearInterval(interval);
      overlay.classList.remove('active');
      if (pInZone.includes(playerId)) {
        enterMatch(mode, pInZone);
      } else {
        countdownActive = false;
      }
    }
  }, 1000);
}

// ═══════════════════════════════════════════
//  MATCH SYSTEM
// ═══════════════════════════════════════════
function enterMatch(mode, playerIds) {
  gamePhase = 'match';
  currentMode = mode;
  matchTiles = {};
  matchPlayers = {};
  playerIds.forEach(id => matchPlayers[id] = true);

  document.getElementById('match-status').textContent = `${mode.toUpperCase()} MATCH IN PROGRESS`;
  document.getElementById('zone-label').textContent = mode.toUpperCase();

  pos.x = Math.floor(GRID_SIZE / 2) + (Math.random() < 0.5 ? -4 : 4);
  pos.y = Math.floor(GRID_SIZE / 2) + (Math.random() < 0.5 ? -4 : 4);

  const matchRef = db.ref('rooms/match_' + currentRoom);
  matchRef.child('players/' + playerId).set({
    name: playerName, skin: playerSkin,
    x: pos.x, y: pos.y
  });
  matchRef.child('players/' + playerId).onDisconnect().remove();

  matchRef.child('players').on('value', snap => {
    const players = snap.val() || {};
    if (gamePhase === 'match') renderGrid({ ...players });
    renderPlayerList(players);
  });

  matchRef.child('tiles').on('value', snap => {
    matchTiles = snap.val() || {};
  });

  db.ref('chat/match_' + currentRoom).limitToLast(50).on('child_added', snap => {
    const msg = snap.val();
    if (msg && chatChannel === 'match') appendChatMsg(msg);
  });
  addSystemMsg('lobby', `⚔️ Match started: ${mode.toUpperCase()}`);
  addSystemMsg('match', `⚔️ ${mode.toUpperCase()} match started! Capture tiles!`);

  if (mode === 'chaos') startChaosEffects();
  if (mode === 'survival') startSurvivalShrink();

  let timeLeft = 90;
  matchTimer = setInterval(() => {
    timeLeft--;
    document.getElementById('match-status').textContent = `${mode.toUpperCase()} — ⏱ ${timeLeft}s`;
    if (timeLeft <= 0) endMatch();
  }, 1000);
}

function startChaosEffects() {
  chaosTeleportInterval = setInterval(() => {
    if (gamePhase !== 'match') { clearInterval(chaosTeleportInterval); return; }
    if (Math.random() < 0.3) {
      pos.x = Math.floor(Math.random() * GRID_SIZE);
      pos.y = Math.floor(Math.random() * GRID_SIZE);
      db.ref('rooms/match_' + currentRoom + '/players/' + playerId).update({ x: pos.x, y: pos.y });
      showToast('🌀 Chaos warp!');
    }
  }, 8000);
}

function startSurvivalShrink() {
  survivalRadius = 14;
  survivalCenter = { x: 15, y: 15 };
  const shrink = setInterval(() => {
    if (gamePhase !== 'match') { clearInterval(shrink); return; }
    survivalRadius -= 1;
    if (survivalRadius < 3) survivalRadius = 3;
    showToast('⚠ Zone shrinking!');
    const dist = Math.sqrt((pos.x - survivalCenter.x) ** 2 + (pos.y - survivalCenter.y) ** 2);
    if (dist > survivalRadius) {
      showToast('💀 You died! Zone killed you.');
      endMatch();
    }
  }, 12000);
}

function endMatch() {
  if (gamePhase !== 'match') return;
  clearInterval(matchTimer);
  if (chaosTeleportInterval) clearInterval(chaosTeleportInterval);
  gamePhase = 'matchend';

  const counts = {};
  for (const idx in matchTiles) {
    const owner = matchTiles[idx];
    counts[owner] = (counts[owner] || 0) + 1;
  }

  const myTiles = counts[playerId] || 0;
  const maxTiles = Math.max(...Object.values(counts).map(Number), 0);
  const won = myTiles === maxTiles && myTiles > 0;

  const xpGain = myTiles * 2 + (won ? 50 : 10);
  const coinGain = myTiles + (won ? 20 : 5);
  playerData.xp += xpGain;
  playerData.coins += coinGain;
  if (won) playerData.wins += 1;
  checkLevelUp();
  savePlayerData();
  updatePlayerHUD();

  const title = document.getElementById('match-end-title');
  const sub = document.getElementById('match-end-sub');
  const xpEl = document.getElementById('match-end-xp');

  if (won) { title.textContent = '🏆 VICTORY!'; title.className = 'win'; }
  else      { title.textContent = 'DEFEAT';      title.className = 'lose'; }
  sub.textContent = `Tiles captured: ${myTiles}`;
  xpEl.textContent = `+${xpGain} XP  +${coinGain} 🪙`;
  document.getElementById('match-end-overlay').classList.add('active');

  setTimeout(() => {
    db.ref('rooms/match_' + currentRoom + '/players/' + playerId).remove();
  }, 3000);
}

function returnToLobby() {
  document.getElementById('match-end-overlay').classList.remove('active');
  gamePhase = 'lobby';
  countdownActive = false;
  matchTiles = {};
  matchPlayers = {};
  pos = { x: 15, y: 15 };

  // Re-write full player entry back into shared lobby
  db.ref('players/' + playerId).set({
    name: playerName, skin: playerSkin,
    x: pos.x, y: pos.y,
    xp: playerData.xp, wins: playerData.wins,
    coins: playerData.coins, level: playerData.level
  });
  document.getElementById('match-status').textContent = 'Welcome back to the lobby!';
  document.getElementById('zone-label').textContent = 'LOBBY';
}

// ═══════════════════════════════════════════
//  VOTING
// ═══════════════════════════════════════════
function toggleVote() {
  document.getElementById('vote-ui').classList.toggle('active');
}

function castVote(mode) {
  if (myVote) {
    db.ref('votes/lobby/' + myVote).transaction(v => Math.max(0, (v || 0) - 1));
  }
  myVote = mode;
  db.ref('votes/lobby/' + mode).transaction(v => (v || 0) + 1);
  ['classic','chaos','survival'].forEach(m => {
    document.getElementById('vbtn-' + m).classList.toggle('voted', m === mode);
  });
}

function updateVoteUI(v) {
  const total = (v.classic || 0) + (v.chaos || 0) + (v.survival || 0) || 1;
  ['classic','chaos','survival'].forEach(m => {
    const pct = ((v[m] || 0) / total * 100).toFixed(0);
    document.getElementById('vb-' + m).style.width = pct + '%';
    document.getElementById('vc-' + m).textContent = v[m] || 0;
  });
}

// ═══════════════════════════════════════════
//  CHAT
// ═══════════════════════════════════════════
function switchChat(ch) {
  chatChannel = ch;
  document.getElementById('tab-lobby').classList.toggle('active', ch === 'lobby');
  document.getElementById('tab-match').classList.toggle('active', ch === 'match');
  document.getElementById('chat-messages').innerHTML = '';
  const ref = ch === 'lobby' ? 'chat/lobby' : 'chat/match_' + currentRoom;
  db.ref(ref).limitToLast(50).once('value', snap => {
    const msgs = snap.val() || {};
    Object.values(msgs).sort((a,b) => a.ts - b.ts).forEach(m => appendChatMsg(m));
  });
}

function chatKey(e) {
  if (e.key === 'Enter') sendChat();
}

function sendChat() {
  const inp = document.getElementById('chat-input');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';

  const isNyx = playerName === 'Nyx';

  if (text === '/help') {
    const cmds = [
      '── Commands ──',
      '/clear — wipe your chat screen',
      '/mute username — toggle mute a player',
      '/w username message — send a whisper',
      ...(isNyx ? [
        '── Admin (Nyx only) ──',
        '/kick username — kick a player',
        '/ban username — permanently ban a player',
        '/unban username — lift a ban',
        '/announce message — broadcast system msg',
        'R key — reset the entire map',
      ] : []),
    ];
    cmds.forEach(c => appendChatMsg({ system: true, text: c, ts: Date.now() }));
    return;
  }

  if (text === '/clear') { document.getElementById('chat-messages').innerHTML = ''; return; }

  if (text.startsWith('/mute ')) {
    const targetName = text.slice(6).trim();
    if (!targetName) { showToast('Usage: /mute username'); return; }
    const entry = Object.entries(lobbyPlayers).find(([, p]) => (p.name || '').toLowerCase() === targetName.toLowerCase());
    if (!entry) { showToast(`Player "${targetName}" not found`); return; }
    const [targetPid] = entry;
    if (targetPid === playerId) { showToast("You can't mute yourself"); return; }
    const wasMuted = mutedPlayers.has(targetPid);
    if (wasMuted) mutedPlayers.delete(targetPid); else mutedPlayers.add(targetPid);
    showToast(wasMuted ? `🔊 Unmuted ${targetName}` : `🔇 Muted ${targetName}`);
    switchChat(chatChannel);
    return;
  }

  if (text.startsWith('/w ')) {
    const rest = text.slice(3).trim();
    const spaceIdx = rest.indexOf(' ');
    if (spaceIdx === -1) { showToast('Usage: /w username message'); return; }
    const targetName = rest.slice(0, spaceIdx);
    const whisperText = rest.slice(spaceIdx + 1).trim();
    if (!whisperText) { showToast('Usage: /w username message'); return; }
    const entry = Object.entries(lobbyPlayers).find(([, p]) => (p.name || '').toLowerCase() === targetName.toLowerCase());
    if (!entry) { showToast(`Player "${targetName}" not found`); return; }
    const [targetPid] = entry;
    db.ref('whispers/' + targetPid).push({ from: playerName, text: whisperText, ts: Date.now() });
    appendChatMsg({ system: true, text: `💌 Whisper to ${entry[1].name}: ${whisperText}`, ts: Date.now() });
    return;
  }

  if (text.startsWith('/kick ') && isNyx) {
    const targetName = text.slice(6).trim();
    const entry = Object.entries(lobbyPlayers).find(([, p]) => (p.name || '').toLowerCase() === targetName.toLowerCase());
    if (!entry) { showToast(`Player "${targetName}" not found`); return; }
    const [targetPid] = entry;
    db.ref('actions/' + targetPid).set({ action: 'kick', by: playerName, ts: Date.now() });
    db.ref('players/' + targetPid).remove();
    showToast(`👢 Kicked ${entry[1].name}`);
    return;
  }

  if (text.startsWith('/ban ') && isNyx) {
    const targetName = text.slice(5).trim();
    const entry = Object.entries(lobbyPlayers).find(([, p]) => (p.name || '').toLowerCase() === targetName.toLowerCase());
    if (!entry) { showToast(`Player "${targetName}" not found`); return; }
    const [targetPid, targetPlayer] = entry;
    const bKey = (targetPlayer.name || targetName).toLowerCase().replace(/[^a-z0-9]/g, '_');
    db.ref('bans/' + bKey).set({ by: playerName, ts: Date.now(), name: targetPlayer.name });
    db.ref('actions/' + targetPid).set({ action: 'ban', by: playerName, ts: Date.now() });
    db.ref('players/' + targetPid).remove();
    showToast(`🚫 Banned ${targetPlayer.name}`);
    return;
  }

  if (text.startsWith('/unban ') && isNyx) {
    const targetName = text.slice(7).trim();
    const bKey = targetName.toLowerCase().replace(/[^a-z0-9]/g, '_');
    db.ref('bans/' + bKey).remove();
    showToast(`✅ Unbanned ${targetName}`);
    return;
  }

  if (text.startsWith('/announce ') && isNyx) {
    const msg2 = text.slice(10).trim();
    if (!msg2) { showToast('Usage: /announce message'); return; }
    addSystemMsg('lobby', `📢 [ADMIN] ${msg2}`);
    return;
  }

  const msg = { pid: playerId, name: playerName, skin: playerSkin, text, ts: Date.now() };
  const ch = gamePhase === 'match' ? 'chat/match_' + currentRoom : 'chat/lobby';
  db.ref(ch).push(msg);
}

function appendChatMsg(msg) {
  if (!msg) return;
  const wrap = document.getElementById('chat-messages');
  const isMuted = mutedPlayers.has(msg.pid);
  const isMine = msg.pid === playerId;

  if (msg.system) {
    const d = document.createElement('div');
    d.className = 'msg';
    d.innerHTML = `<div class="msg-system">${escapeHtml(msg.text)}</div>`;
    wrap.appendChild(d);
  } else {
    const d = document.createElement('div');
    d.className = 'msg' + (isMuted ? ' msg-muted' : '');
    const col = skinColor(msg.skin || 'red');
    const time = new Date(msg.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    d.innerHTML = `
      <div class="msg-header">
        <span class="msg-name" style="color:${col.startsWith('linear') ? '#ff88ff' : col}">${escapeHtml(nameDisplay(msg.name))}</span>
        <span class="msg-time">${time}</span>
        ${!isMine ? `<button class="msg-mute-btn" onclick="toggleMute('${msg.pid}')">🔇</button>` : ''}
      </div>
      <div class="msg-text">${escapeHtml(msg.text)}</div>
    `;
    wrap.appendChild(d);
  }

  const MAX_CHAT_MSGS = 10;
  while (wrap.children.length > MAX_CHAT_MSGS) {
    wrap.removeChild(wrap.firstChild);
  }
  wrap.scrollTop = wrap.scrollHeight;
}

function addSystemMsg(ch, text) {
  const msg = { system: true, text, ts: Date.now() };
  const key = ch === 'lobby' ? 'chat/lobby' : 'chat/match_' + currentRoom;
  db.ref(key).push(msg);
  if (chatChannel === ch) appendChatMsg(msg);
}

function toggleMute(pid) {
  if (mutedPlayers.has(pid)) mutedPlayers.delete(pid);
  else mutedPlayers.add(pid);
  showToast(mutedPlayers.has(pid) ? '🔇 Player muted' : '🔊 Player unmuted');
  switchChat(chatChannel);
}

function escapeHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ═══════════════════════════════════════════
//  PLAYER LIST
// ═══════════════════════════════════════════
function renderPlayerList(players) {
  const el = document.getElementById('players-list');
  el.innerHTML = '';
  let count = 0;
  for (const id in players) {
    if (count >= 100) break;
    const p = players[id];
    const col = skinColor(p.skin || 'red');
    const d = document.createElement('div');
    d.className = 'player-entry' + (id === playerId ? ' me' : '');
    d.innerHTML = `
      <div class="player-dot" style="background:${col.startsWith('linear') ? '#ff88ff' : col}"></div>
      <span class="player-entry-name">${escapeHtml(nameDisplay(p.name || id))}</span>
      <span style="font-size:10px;color:var(--text-dim)">Lv${p.level||1}</span>
    `;
    el.appendChild(d);
    count++;
  }
}

// ═══════════════════════════════════════════
//  SHOP
//
//  FIX: canvas was being destroyed by innerHTML += after
//  appendChild(canvas). All labels are now created as DOM
//  nodes so the canvas element is never clobbered.
// ═══════════════════════════════════════════
function buildShopInto(grid, swatchSize) {
  grid.innerHTML = '';
  SKINS.forEach(s => {
    const owned   = playerData.ownedSkins.includes(s.id);
    const equipped = playerData.equippedSkin === s.id;
    const canBuy  = playerData.coins >= s.cost && playerData.level >= s.level;
    const locked  = !owned && !canBuy;

    const div = document.createElement('div');
    div.className = 'shop-item' + (owned ? ' owned' : '') + (equipped ? ' equipped' : '') + (locked ? ' locked' : '');

    // Canvas created as a proper DOM node — never touched by innerHTML
    const canvas = document.createElement('canvas');
    canvas.className = 'shop-swatch';
    canvas.width = swatchSize; canvas.height = swatchSize;
    drawSkinCanvas(canvas, s.id);
    div.appendChild(canvas);

    // Name
    const nameEl = document.createElement('div');
    nameEl.className = 'shop-name';
    nameEl.textContent = s.name;
    div.appendChild(nameEl);

    // Status
    if (equipped) {
      const badge = document.createElement('div');
      badge.className = 'shop-badge';
      badge.textContent = 'ON';
      div.appendChild(badge);
    } else if (owned) {
      const pr = document.createElement('div');
      pr.className = 'shop-price';
      pr.style.color = 'var(--green)';
      pr.textContent = 'Equip';
      div.appendChild(pr);
    } else {
      const pr = document.createElement('div');
      pr.className = 'shop-price';
      pr.textContent = `${s.cost}🪙 Lv${s.level}`;
      div.appendChild(pr);
    }

    div.addEventListener('click', () => {
      if (locked) { showToast(`Need Lv${s.level} & ${s.cost}🪙`); return; }
      if (!owned) {
        playerData.coins -= s.cost;
        playerData.ownedSkins.push(s.id);
        savePlayerData();
        showToast(`🎉 ${s.name} skin unlocked!`);
        addSystemMsg('lobby', `✨ ${playerName} unlocked the "${s.name}" skin!`);
      }
      playerSkin = s.id;
      playerData.equippedSkin = s.id;
      savePlayerData();
      // Update only skin field, not full player object
      db.ref('players/' + playerId + '/skin').set(playerSkin);
      updatePlayerHUD();
      buildShop();
      showToast(`Equipped: ${s.name}`);
    });

    grid.appendChild(div);
  });
}

function buildShop() {
  buildShopInto(document.getElementById('shop-grid'), 32);
  const full = document.getElementById('shop-grid-full');
  if (full) buildShopInto(full, 52);
}

// ═══════════════════════════════════════════
//  LEADERBOARD
// ═══════════════════════════════════════════
let lbVisible = true;
function toggleLeaderboard() {
  lbVisible = !lbVisible;
  document.getElementById('leaderboard-panel').style.display = lbVisible ? '' : 'none';
}

function renderLeaderboard(players) {
  const el = document.getElementById('leaderboard-panel');
  const sorted = Object.entries(players)
    .map(([id, p]) => ({ id, ...p }))
    .sort((a, b) => (b.wins || 0) - (a.wins || 0))
    .slice(0, 10);

  el.innerHTML = '';
  sorted.forEach((p, i) => {
    const col = skinColor(p.skin || 'red');
    const row = document.createElement('div');
    row.className = 'lb-row';
    const medals = ['🥇','🥈','🥉'];
    row.innerHTML = `
      <span class="lb-rank">${medals[i] || (i+1)}</span>
      <div class="lb-swatch" style="background:${col.startsWith('linear') ? '#ff88ff' : col}"></div>
      <span class="lb-name">${escapeHtml(nameDisplay(p.name || p.id))}</span>
      <span class="lb-wins">${p.wins || 0}W</span>
    `;
    el.appendChild(row);
  });
}

// ═══════════════════════════════════════════
//  ROOMS
// ═══════════════════════════════════════════
function openRooms() {
  document.getElementById('room-panel').classList.add('active');
  loadRooms();
}
function closeRooms() {
  document.getElementById('room-panel').classList.remove('active');
}

function loadRooms() {
  const wrap = document.getElementById('room-list-wrap');
  wrap.innerHTML = '<div style="color:var(--text-dim);font-size:13px">Loading rooms...</div>';

  db.ref('roomList').once('value', snap => {
    const rooms = snap.val() || {};
    wrap.innerHTML = '';

    const lobbyEntry = document.createElement('div');
    lobbyEntry.className = 'room-entry';
    lobbyEntry.innerHTML = `
      <span class="room-name">🏠 Main Lobby</span>
      <span class="room-count">Public</span>
    `;
    lobbyEntry.onclick = () => { closeRooms(); showToast('You are in Main Lobby'); };
    wrap.appendChild(lobbyEntry);

    for (const rid in rooms) {
      const r = rooms[rid];
      const entry = document.createElement('div');
      entry.className = 'room-entry';
      entry.innerHTML = `
        <span class="room-name">${escapeHtml(r.name)}</span>
        <span class="room-count">${r.playerCount || 0}/${r.max || 20}</span>
        <span class="room-lock">${r.password ? '🔒' : '🔓'}</span>
      `;
      entry.onclick = () => joinRoom(rid, r);
      wrap.appendChild(entry);
    }

    if (!Object.keys(rooms).length) {
      const empty = document.createElement('div');
      empty.style.cssText = 'color:var(--text-dim);font-size:13px;padding:10px';
      empty.textContent = 'No custom rooms yet. Create one!';
      wrap.appendChild(empty);
    }
  });
}

function joinRoom(rid, room) {
  if (room.password) {
    const pw = prompt('Enter password:');
    if (pw !== room.password) { showToast('Wrong password'); return; }
  }
  currentRoom = rid;
  showToast(`Joined room: ${room.name}`);
  closeRooms();
}

function createRoom() {
  const name = prompt('Room name:');
  if (!name || !name.trim()) return;
  const pw = prompt('Password (leave blank for public):') || '';
  const max = parseInt(prompt('Max players (2-100):') || '20');

  const rid = 'room_' + Date.now();
  db.ref('roomList/' + rid).set({
    name: name.trim(),
    password: pw,
    max: Math.min(100, Math.max(2, max || 20)),
    host: playerId,
    playerCount: 1,
    createdAt: Date.now()
  });
  currentRoom = rid;
  showToast(`Room "${name}" created!`);
  closeRooms();
}

// ═══════════════════════════════════════════
//  PROGRESSION & HUD
// ═══════════════════════════════════════════
const XP_PER_LEVEL = 100;

function xpForLevel(lvl) { return lvl * XP_PER_LEVEL; }

function checkLevelUp() {
  const needed = xpForLevel(playerData.level);
  if (playerData.xp >= needed) {
    playerData.xp -= needed;
    playerData.level += 1;
    showToast(`🎉 Level up! You are now Level ${playerData.level}!`);
    addSystemMsg('lobby', `⬆️ ${playerName} reached Level ${playerData.level}!`);
    buildShop();
  }
}

function updateXPBar() {
  const needed = xpForLevel(playerData.level);
  const pct = Math.min(100, (playerData.xp / needed * 100)).toFixed(1);
  document.getElementById('xp-bar').style.width = pct + '%';
}

function updatePlayerHUD() {
  document.getElementById('player-name').textContent = playerName;
  document.getElementById('player-level').textContent = `LVL ${playerData.level}`;
  document.getElementById('player-coins').textContent = `🪙 ${playerData.coins} coins`;
  document.getElementById('player-wins').textContent = `🏆 ${playerData.wins} wins`;
  updateXPBar();
  drawSkinCanvas(document.getElementById('player-avatar'), playerSkin);
}

function savePlayerData() {
  playerData.equippedSkin = playerSkin;
  localStorage.setItem('ptiles_' + playerName, JSON.stringify(playerData));
  if (playerId) {
    // Update only stats/skin — preserve x,y already in Firebase
    db.ref('players/' + playerId).update({
      xp: playerData.xp,
      wins: playerData.wins,
      coins: playerData.coins,
      level: playerData.level,
      skin: playerSkin
    });
  }
}

// ═══════════════════════════════════════════
//  TOAST
// ═══════════════════════════════════════════
let toastTimeout = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => el.classList.remove('show'), 2200);
}

// ═══════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  buildLoginSkins();
  window.addEventListener('resize', () => {
    if (gamePhase !== 'lobby' && gamePhase !== 'match') return;
    if (cells.length) initGrid();
  });
});
</script>
</body>
